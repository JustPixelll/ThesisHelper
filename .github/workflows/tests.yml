name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify the actual Windows installer
        if: runner.os == 'Windows' && matrix['python-version'] == '3.12'
        run: python -c "import subprocess; subprocess.run(['cmd', '/d', '/c', 'install.bat'], input='\n', text=True, check=True, timeout=600)"
      - name: Run offline regression tests
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exact frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Check frontend JavaScript
        run: npm run check
        working-directory: frontend
      - name: Run frontend integration tests
        run: npm test
        working-directory: frontend
      - name: Build the bundled interface
        run: npm run build
        working-directory: frontend
      - name: Verify shipped assets match their source
        run: git diff --exit-code -- thesishelper/static

  browser:
    runs-on: ubuntu-latest
    needs: frontend
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-browser.txt
      - name: Install browser-test dependencies
        run: python -m pip install -r requirements-browser.txt
      - name: Install Chromium and Linux libraries
        run: python -m playwright install --with-deps chromium
      - name: Exercise the real browser with a local fake model
        run: python tests/browser_smoke.py
      - name: Keep browser screenshots, trace, and exported Word document
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-artifacts
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
